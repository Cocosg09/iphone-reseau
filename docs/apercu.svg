<svg xmlns="http://www.w3.org/2000/svg" width="720" height="236" viewBox="0 0 720 236" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Aperçu d'iphone-reseau dans la barre des menus</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <clipPath id="screen"><rect width="720" height="236" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#screen)">
    <rect width="720" height="236" fill="url(#wall)"/>

    <!-- Barre des menus -->
    <rect width="720" height="30" fill="#000" fill-opacity="0.35"/>
    <circle cx="24" cy="15" r="6" fill="#fff"/>
    <text x="42" y="20" fill="#fff" font-size="13" font-weight="600">Finder</text>
    <text x="98" y="20" fill="#fff" font-size="13" fill-opacity="0.9">Fichier   Édition   Présentation</text>

    <!-- Icône iphone-reseau : 5G + barre de progression animée -->
    <g transform="translate(520 0)">
      <rect x="-8" y="3" width="40" height="24" rx="5" fill="#fff" fill-opacity="0.18"/>
      <text x="12" y="17" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">5G</text>
      <rect x="0" y="21" width="24" height="2" rx="1" fill="#fff" fill-opacity="0.3"/>
      <rect x="0" y="21" width="0" height="2" rx="1" fill="#fff">
        <animate attributeName="width" from="0" to="24" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(574 19)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
      <path d="M-7 -5 A10 10 0 0 1 7 -5"/>
      <path d="M-4.2 -2 A6 6 0 0 1 4.2 -2"/>
      <circle cx="0" cy="1.5" r="1.2" fill="#fff" stroke="none"/>
    </g>
    <text x="600" y="20" fill="#fff" font-size="13" font-weight="500">mar. 27 oct.  18:06</text>

    <!-- Menu déroulant -->
    <g transform="translate(400 38)">
      <rect width="250" height="186" rx="10" fill="#f5f5f7" fill-opacity="0.96"/>
      <rect width="250" height="186" rx="10" fill="none" stroke="#000" stroke-opacity="0.12"/>
      <text x="14" y="26" font-size="13" fill="#1d1d1f" font-weight="600">iPhone de Corentin</text>
      <text x="14" y="48" font-size="13" fill="#1d1d1f">Réseau : 5G</text>
      <text x="14" y="70" font-size="13" fill="#1d1d1f">Signal : 3/4</text>
      <text x="14" y="92" font-size="13" fill="#1d1d1f">Batterie : 75 %</text>
      <text x="14" y="114" font-size="13" fill="#1d1d1f">Latence : 71 ms · perte 0 %</text>
      <text x="14" y="136" font-size="13" fill="#86868b">Prochaine mise à jour dans 6 s</text>
      <line x1="10" y1="150" x2="240" y2="150" stroke="#000" stroke-opacity="0.12"/>
      <text x="14" y="172" font-size="13" fill="#1d1d1f">Quitter</text>
      <text x="236" y="172" font-size="13" fill="#86868b" text-anchor="end">⌘Q</text>
    </g>

    <!-- États d'alerte -->
    <g transform="translate(28 64)">
      <text x="0" y="0" font-size="13" fill="#fff" font-weight="700">États de l'icône</text>

      <g transform="translate(0 22)">
        <rect width="44" height="26" rx="6" fill="#000" fill-opacity="0.35"/>
        <text x="22" y="15" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">5G</text>
        <rect x="10" y="19" width="24" height="2" rx="1" fill="#fff" fill-opacity="0.3"/>
        <rect x="10" y="19" width="15" height="2" rx="1" fill="#fff"/>
        <text x="58" y="17" fill="#fff" font-size="13">Connexion normale</text>
      </g>

      <g transform="translate(0 60)">
        <rect width="44" height="26" rx="6" fill="#000" fill-opacity="0.35"/>
        <text x="22" y="15" fill="#ff9f0a" font-size="12" font-weight="600" text-anchor="middle">LTE</text>
        <rect x="10" y="19" width="24" height="2" rx="1" fill="#ff9f0a" fill-opacity="0.3"/>
        <rect x="10" y="19" width="9" height="2" rx="1" fill="#ff9f0a"/>
        <text x="58" y="17" fill="#fff" font-size="13">Lente : latence, pertes, réseau dégradé</text>
      </g>

      <g transform="translate(0 98)">
        <rect width="44" height="26" rx="6" fill="#000" fill-opacity="0.35"/>
        <text x="22" y="15" fill="#ff453a" font-size="12" font-weight="600" text-anchor="middle">5G</text>
        <rect x="10" y="19" width="24" height="2" rx="1" fill="#ff453a" fill-opacity="0.3"/>
        <rect x="10" y="19" width="20" height="2" rx="1" fill="#ff453a"/>
        <text x="58" y="17" fill="#fff" font-size="13">Plus d'accès à internet</text>
      </g>
    </g>
  </g>
</svg>
